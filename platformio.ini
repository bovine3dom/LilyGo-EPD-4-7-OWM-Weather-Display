; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = T5_4_7Inc_Plus_V2
data_dir = .pio/fsdata
;default_envs = t5-4_7-plus
[env]
platform = espressif32@6.4.0
upload_protocol = esptool
framework = arduino
upload_speed = 921600
monitor_speed = 115200
extra_scripts = pre:scripts/prepare_spiffs.py
lib_deps = Wire
           https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
           bblanchon/ArduinoJson@^6.19.4

[env:t5-4_7]
extends = env
board = esp32dev
build_flags =
    -DBOARD_HAS_PSRAM
board_build.filesystem = spiffs

[env:t5-4_7-plus]
extends = env
board = esp32s3box
build_flags =
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    -UARDUINO_USB_CDC_ON_BOOT
    -DBOARD_HAS_PSRAM
board_build.filesystem = spiffs


[env:T5_4_7Inc_Plus_V2]
extends = env
board = esp32s3box
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT
    -DT5_47_PLUS_V2=1
    -DEPDPARTIAL=1
    -DEPD1B_PRESET_LILYGO_EPD47_H716
    -DBOARD_HAS_PSRAM
lib_deps = ${env.lib_deps}
           https://github.com/tonywestonuk/EPD_Painter_1bit.git#0f1ba04814b686e5db3873351c53f197c1d17cb1
board_build.filesystem = spiffs
